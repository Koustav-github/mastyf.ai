name: MCP Protocol Fuzzer CI

on:
  push:
    branches: [main]
    paths:
      - 'src/policy/**'
      - 'src/proxy/**'
      - 'src/utils/mcp-http-relay.ts'
      - 'packages/core/**'
      - 'default-policy.yaml'
      - 'adversarial-harness/node/mock-mcp-server.mjs'
      - '.github/workflows/mcp-fuzzer-ci.yml'
      - '.github/actions/mcp-fuzzer/**'
  pull_request:
    paths:
      - 'src/policy/**'
      - 'src/proxy/**'
      - 'src/utils/mcp-http-relay.ts'
      - 'packages/core/**'
      - 'default-policy.yaml'
      - 'adversarial-harness/node/mock-mcp-server.mjs'
      - '.github/workflows/mcp-fuzzer-ci.yml'
      - '.github/actions/mcp-fuzzer/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      target_url:
        description: MCP server URL to fuzz
        required: false
        default: 'http://localhost:4000/mcp'

jobs:
  fuzz-mcp-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Mastyf AI image
        run: docker build -f deploy/Dockerfile -t mastyf-ai:fuzz .

      # The gateway needs an upstream MCP server to sit in front of; without one the proxy
      # exits ("No MCP config files found") and nothing listens on :4000. The harness mock
      # server ships in the image, needs no network, and echoes every call that reaches it.
      #
      # Policy: the default policy in block mode (without one the proxy only audits).
      # MASTYF_AI_AGENTIC_ENABLED=false keeps the adaptive layer (zero-trust step-up, sandbox
      # tiers, approvals) out of it: for an anonymous client it blocks every call, attacks
      # and benign alike, so the fuzz would measure that instead of the policy. The
      # fuzzer's control call checks that a harmless call still runs.
      - name: Start Mastyf AI
        run: |
          mkdir -p "$RUNNER_TEMP/mastyf"
          cat > "$RUNNER_TEMP/mastyf/mcp.json" <<'EOF'
          {
            "mcpServers": {
              "mock": {
                "command": "node",
                "args": ["/app/adversarial-harness/node/mock-mcp-server.mjs"],
                "transport": "stdio"
              }
            }
          }
          EOF
          chmod 644 "$RUNNER_TEMP/mastyf/mcp.json"
          docker run -d --name mastyf-ai \
            -p 4000:4000 -p 9090:9090 \
            -v "$RUNNER_TEMP/mastyf/mcp.json:/etc/mastyf-ai/mcp.json:ro" \
            -e MASTYF_AI_POLICY_PATH=/app/default-policy.yaml \
            -e MASTYF_AI_BLOCKING_MODE=block \
            -e MASTYF_AI_AGENTIC_ENABLED=false \
            -e DASHBOARD_ENABLED=true \
            -e DASHBOARD_PORT=4000 \
            -e DASHBOARD_AUTH_DISABLED=true \
            -e METRICS_ENABLED=true \
            -e METRICS_PORT=9090 \
            -e MASTYF_AI_DB_PATH=/data/history.db \
            mastyf-ai:fuzz

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for Mastyf AI to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:4000/ > /dev/null 2>&1; then
              echo "Mastyf AI is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Mastyf AI failed to start"
              docker logs mastyf-ai || true
              exit 1
            fi
            sleep 2
          done

      - name: Run MCP Protocol Fuzzer
        uses: ./.github/actions/mcp-fuzzer
        with:
          target_url: ${{ github.event.inputs.target_url || 'http://localhost:4000/mcp' }}
          min_block_rate: '80'
          timeout_seconds: '10'
          fail_on_bypass: 'true'
          # The mock server's harmless tool; skipped when fuzzing another target by hand.
          control_tool: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.target_url == 'http://localhost:4000/mcp') && 'echo' || '' }}

      - name: Stop Mastyf AI
        if: always()
        run: docker rm -f mastyf-ai || true

      - name: Fuzz report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-fuzz-report
          path: |
            fuzz-report.json
          retention-days: 30
